<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.google.com/specimen/Hanken+Grotesk">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<link rel="stylesheet" href="styles/left.css">
<link rel="stylesheet" href="styles/right.css">
<style>
  
.container{
  display: flex;
 
}




</style>
  
</head>


<body style="background-color: white;">
  <div class="container">
    <!-- left box -->
  <div class="left-box">
    <div class="result-text">
<P class="result">Your Result</P>
    </div>
    <div class="circle"></div>
    <div class="score">
      <p class="first-number">76</p>
      <p class="second-number">of 100</p>
    </div>
  
    <div class="great-text">
      <p>Great</p>
    </div>
    <div class="conclusion-text">
      You scored higher than 65% of the people who have taken these test.
    </div>
  </div>
<!-- right box  -->
<div class="right-box">
  <div class="summary">
    Summary
  </div>
  <div class="reaction">
    <div class="reaction-icon">
      <img src="icon/icon-reaction.svg" alt="ri">
    </div>
    <div class="reaction-text">
      Reaction
    </div>
    <div class="reaction-score">
      <p>80 / 100</p>
    </div>
  </div>    
  <!-- reaction parts complete -->
<div class="memory">
  <div class="memory-icon">
    <img src="icon/icon-memory.svg" alt="mi">
  </div>
  <div class="memory-text">
    memory
  </div>
  <div class="memory-score">
    <span>92</span> / 100
  </div>
</div>
<!-- memory parts complete -->
<div class="verbal">
  <div class="verbal-icon">
    <img src="icon/icon-verbal.svg" alt="">
  </div>
  <div class="verbal-text">
    verbal
  </div>
  <div class="verbal-score">
    <span>61</span> / 100
  </div>
</div>
 <!-- verbal parts complete -->
<div class="visual">
  <div class="visual-icon">
    <img src="icon/icon-visual.svg" alt="">
  </div>
  <div class="visual-text">
    Visual
  </div>
<div class="visual-score">
<b> 72</b> / 100
</div>
</div>
<!-- visual part complete -->

<div class="continue">
  <button class="continue-button">Continue</button>
</div>
</div>
<!-- the end -->
</div>

  
</body>
</html>
